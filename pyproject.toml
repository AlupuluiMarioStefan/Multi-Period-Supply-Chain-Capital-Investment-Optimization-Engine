[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "distnet"
version = "1.0.0"
description = "Profit-maximising distribution network design (facility location, carriers, construction scheduling) with PuLP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pulp>=2.7", "numpy"]
keywords = ["operations-research", "optimization", "mixed-integer-programming", "pulp", "facility-location"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
distnet = "distnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
